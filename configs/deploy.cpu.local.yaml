camera:
  width: 640
  height: 480
  fps: 30
  align_to_color: true
  spatial_filter: true
  temporal_filter: false
  hole_filling_filter: false

detection:
  weights: weights/yolov10_sam_robust_standard.onnx
  backend: onnxruntime
  image_size: 640
  class_names: {0: apple}
  conf_threshold: 0.50
  device: cpu

tracking:
  high_conf_threshold: 0.50
  low_conf_threshold: 0.10
  iou_threshold: 0.3
  min_hits: 1
  max_lost: 30

roi:
  size: 256
  pad_ratio: 0.20

segmentation:
  weights: weights/rgbd_gcnet_l03_robustft.onnx
  backend: onnxruntime
  threshold: 0.5
  device: cpu
  input_color_order: bgr
  depth_input_unit: mm

depth_fusion:
  window_size: 5
  method: median
  min_depth_mm: 100
  max_depth_mm: 5000
  min_valid_ratio: 0.3

grasp:
  patch_radius_px: 8
  stride_px: 4
  min_component_area_px: 64
  min_valid_depth_ratio: 0.7
  min_valid_depth_count: 20
  max_plane_rmse_m: 0.006
  max_depth_mad_m: 0.012
  min_score: 0.0

ranking:
  weights:
    grasp_score: 0.45
    depth_valid_score: 0.20
    track_confidence: 0.15
    track_stability: 0.10
    mask_quality_score: 0.10

recording:
  enabled: false
  output_root: runs
  save_detections: false
  save_candidates: false
  save_targets: false
  save_errors: false
  save_timings: false
  save_events: false
  save_frames: false
  save_depth: false
  save_masks: false
  save_overlays: false
  save_event_artifacts: false

profiling:
  enabled: false

debug:
  enabled: false

diagnostics:
  enabled: false
